name: Generate contribution snake

on:
  schedule:
    # Refresh twice an hour, away from the busy start of the hour.
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/generate-snake.py"

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the contribution calendar generator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate snakes from the public contribution calendar
        run: python3 .github/scripts/generate-snake.py --user "${{ github.repository_owner }}" --output dist

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          commit_message: "Refresh live contribution snake animations"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
